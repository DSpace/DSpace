#---------------------------------------------------------------#
#---------- WITHDRAWN ITEMS (TOMBSTONE) CONFIGURATIONS ---------#
#---------------------------------------------------------------#
# Configuration properties used by the tombstone page of a      #
# withdrawn item.                                               #
#---------------------------------------------------------------#

# Metadata fields of a withdrawn item that stay publicly readable, so that they can be
# shown on its tombstone page. Every other metadata field is hidden to anyone who is not
# an administrator of the item (or of one of its collections/communities).
# Wildcards are supported, e.g. dc.relation.*
# When no field is configured no metadata at all is exposed, which is the historical
# DSpace behaviour. Repeat the property once for each field to expose.
#
# Beware that this configuration is global: it applies to every withdrawn item of the
# repository, so it should be kept to the minimum.
#
# The user interface reads dspace.withdrawn.redirect and dcterms.isReplacedBy from the item to
# know whether a visitor has to be sent to the replacement record, so those two fields
# have to be exposed for the automatic redirect to work.
#
item.withdrawn.publicField = dc.title
item.withdrawn.publicField = dspace.withdrawn.reason
item.withdrawn.publicField = dcterms.isReplacedBy
item.withdrawn.publicField = dspace.withdrawn.redirect
