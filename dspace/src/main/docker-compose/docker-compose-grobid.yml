#
# Test environment for DSpace + GROBID for metadata extraction support. See README for instructions.
# This should NEVER be used in production scenarios.
# To use this with DSpace submissions, make sure GROBID is enabled in grobid.cfg and the extractionstep in item-submission.xml is enabled.
# The grobid.service.url should be "http://dspace-grobid:8070"

networks:
  # Default to using network named 'dspacenet' from docker-compose.yml.
  # Its full name will be prepended with the project name (e.g. "-p d7" means it will be named "d7_dspacenet")
  default:
    name: ${COMPOSE_PROJECT_NAME}_dspacenet
    external: true
services:
  dspace-grobid:
    container_name: dspace-grobid
    image: grobid/grobid:0.9.0-full
    ports:
      - 8070:8070
